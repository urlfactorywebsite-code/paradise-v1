 else if(!(qty>0))err=p.sizes?'Enter quantities for at least one size.':'Enter a valid quantity.';
 else if(qty<minq)err=`Minimum order quantity is ${minq}.`;
 if(!err){
  if(p.m==='unit'){const t=[...p.tiers].reverse().find(t=>qty>=t[0]);rate=R(t[1]);base=rate*qty;L.push([`Base: ${qty} × ${inr(rate)} (tier from ${t[0]})`,base])}

 if(p.sizes)sp.push('Sizes: '+SZ.filter(k=>+c.sz[k]).map(k=>k+' '+c.sz[k]).join(', '));

 d.autoTable({startY:d.lastAutoTable.finalY+6,head:[['Terms and conditions']],body:q.terms.map((x,i)=>[`${i+1}. ${x}`]),theme:'plain',headStyles:{fontStyle:'bold',textColor:[11,85,96]},styles:{fontSize:8,cellPadding:1},margin:{left:14,right:14}});
 let y=d.lastAutoTable.finalY+22;if(y>265){d.addPage();y=40}d.setFontSize(9);d.setTextColor(30);d.line(14,y,70,y);d.text('Authorized Signatory',14,y+5);d.line(140,y,196,y);d.text('Customer Acceptance',140,y+5);
 const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(7.5);d.setTextColor(110);d.text(`${s.name} | ${s.phone} | ${s.email}`,14,290);d.text(`Page ${i} of ${n}`,196,290,{align:'right'})}
 await out(d.output('blob'),q.no.replace(/\//g,'-')+'.pdf');log('PDF generated for '+q.no);persist()}
/* --- all quotations --- */
const listRows=()=>{const k=F.q.toLowerCase(),r=S.quotes.filter(q=>{const c=cust(q.cid),t=tot(q).grand;return(!k||[q.no,c.name,c.co,c.mob,...q.items.map(i=>i.name)].join(' ').toLowerCase().includes(k))&&(!F.st||q.status===F.st)&&(!F.cu||q.cid===F.cu)&&(!F.sp||q.sales===F.sp)&&(!F.a||q.date>=F.a)&&(!F.b||q.date<=F.b)&&(!F.mn||t>=R(F.mn))&&(!F.mx||t<=R(F.mx))});
 return r.map(q=>`<tr><td>${q.no}</td><td>${fd(q.date)}</td><td>${esc(cust(q.cid).name)}</td><td>${esc(cust(q.cid).co)}</td><td class="n">${inr(tot(q).grand)}</td><td>${q.by}</td><td>${bg(q.status)}</td><td>${fd(q.valid)}</td><td>${acts(q)} <button class="s b2" onclick="statusQ('${q.id}')">Status</button> <button class="s bd" onclick="delQ('${q.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan=9>No quotations match these filters.</td></tr>'};
V.list=()=>{const f=(k,ph,t)=>`<input style="width:auto;min-width:120px" type="${t||'text'}" placeholder="${ph}" value="${F[k]}" oninput="F.${k}=this.value;$('#tb').innerHTML=listRows()">`;
 return`<h1>All Quotations</h1><div class="card"><div class="row">${f('q','Search number, customer, mobile, product')}<select style="width:auto" onchange="F.st=this.value;$('#tb').innerHTML=listRows()"><option value="">All statuses</option>${ST.map(s=>`<option ${F.st===s?'selected':''}>${s}</option>`).join('')}</select><select style="width:auto" onchange="F.cu=this.value;$('#tb').innerHTML=listRows()"><option value="">All customers</option>${S.customers.map(c=>`<option value="${c.id}" ${F.cu===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select style="width:auto" onchange="F.sp=this.value;$('#tb').innerHTML=listRows()"><option value="">All salespeople</option>${[...new Set(S.quotes.map(q=>q.sales))].map(s=>`<option ${F.sp===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="row">${f('a','From','date')}${f('b','To','date')}${f('mn','Min ₹','number')}${f('mx','Max ₹','number')}</div><div class="tw"><table><tr><th>Number</th><th>Date</th><th>Customer</th><th>Company</th><th class="n">Total</th><th>By</th><th>Status</th><th>Valid until</th><th>Actions</th></tr><tbody id="tb">${listRows()}</tbody></table></div></div>`};
/* --- customers --- */
V.cust=()=>{const k=CQ.q.toLowerCase();return`<h1>Customers</h1><div class="row"><input style="max-width:280px" placeholder="Search customers" value="${esc(CQ.q)}" onchange="CQ.q=this.value;render()"><button class="bo" onclick="custForm('')">+ Add customer</button></div><div class="card tw"><table><tr><th>ID</th><th>Name</th><th>Company</th><th>Mobile</th><th>Email</th><th class="n">Quotes</th><th class="n">Quoted value</th><th>Actions</th></tr>${S.customers.filter(c=>!k||JSON.stringify(c).toLowerCase().includes(k)).map(c=>{const qs=S.quotes.filter(q=>q.cid===c.id);return`<tr><td>${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.co)}</td><td>${c.mob}</td><td>${esc(c.email)}</td><td class="n">${qs.length}</td><td class="n">${inr(qs.reduce((a,q)=>a+tot(q).grand,0))}</td><td><button class="s b2" onclick="custView('${c.id}')">View</button> <button class="s b2" onclick="custForm('${c.id}')">Edit</button></td></tr>`}).join('')}</table></div>`};
function custView(id){const c=cust(id),qs=S.quotes.filter(q=>q.cid===id);modal(`<h2>${esc(c.name)}</h2><div class="mu">${esc(c.co)} · ${c.mob} · ${esc(c.email)} · ${esc(c.addr)} · ${esc(c.gstin)} · created ${fd(c.date)}<br>${esc(c.notes)}</div><h2 style="margin-top:12px">Previous quotations (total quoted ${inr(qs.reduce((a,q)=>a+tot(q).grand,0))})</h2>${qs.map(q=>`<div>${q.no} · ${fd(q.date)} · ${inr(tot(q).grand)} · ${bg(q.status)}</div>`).join('')||'None yet.'}`,640)}
function custForm(id,fromQ){const c=id?cust(id):{};const F_=(k,l,t)=>fld(l,`<input id="cf_${k}" type="${t||'text'}" value="${esc(c[k]||'')}">`);
 modal(`<h2>${id?'Edit':'Add'} customer</h2><div class="grid">${F_('name','Customer name *')}${F_('co','Company name')}${F_('person','Contact person')}${F_('mob','Mobile number *')}${F_('email','Email address')}${F_('gstin','GSTIN')}${F_('addr','Billing address')}${F_('notes','Notes')}</div><br><button onclick="custSave('${id}',${fromQ?1:0})">Save customer</button>`,720)}
function custSave(id,fromQ,force){const v={};['name','co','person','mob','email','gstin','addr','notes'].forEach(k=>v[k]=$('#cf_'+k).value.trim());
 if(!v.name||!/^[0-9+ ]{10,14}$/.test(v.mob)){toast('Enter a customer name and a valid mobile number.','er');return}
 const dup=S.customers.find(c=>c.id!==id&&((v.mob&&c.mob===v.mob)||(v.email&&c.email===v.email)||(v.gstin&&c.gstin===v.gstin)));
 const done=()=>{if(id)Object.assign(cust(id),v);else{const n={id:'C'+(Math.max(0,...S.customers.map(c=>+c.id.slice(1)))+1),date:today(),...v};S.customers.push(n);id=n.id;if(fromQ&&Q)Q.cid=id}log('Saved customer '+v.name);persist();closeM();render();toast('Customer saved')};
 if(dup&&!force){const cv=v;ask(`A customer with the same mobile, email or GSTIN already exists: ${esc(dup.name)}. Records are never merged automatically. Save this as a separate customer?`,()=>{custFormRestore(cv);custSave(id,fromQ,1)},'Save anyway');return}done()}
function custFormRestore(v){Object.keys(v).forEach(k=>{if(!$('#cf_'+k)){const i=document.createElement('input');i.id='cf_'+k;i.value=v[k];i.type='hidden';document.body.append(i)}})}
/* --- products, categories, pricing --- */
const mlab=p=>p.m==='unit'?'Tiered per unit':p.m==='area'?`Per sq ft: ${inr(R(p.rate))}${p.min?' (min '+inr(R(p.min))+')':''}`:'Fixed package';
V.prod=()=>`<h1>Products &amp; Services</h1><div class="note">Sample prices are configurable demo values, not approved Design Paradise prices.</div><div class="row"><button class="bo" onclick="prodForm()">+ Add product</button></div><div class="card tw"><table><tr><th>Code</th><th>Product</th><th>Category</th><th>Pricing</th><th class="n">GST %</th><th>Status</th><th>Actions</th></tr>${S.products.map(p=>`<tr><td>${p.code}</td><td>${esc(p.name)}</td><td>${cat(p.cat)}</td><td>${mlab(p)}${p.tiers?'<br><span class="mu">'+p.tiers.map(t=>t[0]+'+: '+t[1]).join(', ')+'</span>':''}</td><td class="n">${p.tax}</td><td>${p.on?'<span class="bg g">Active</span>':'<span class="bg r">Inactive</span>'}</td><td><button class="s b2" onclick="prodToggle('${p.id}')">${p.on?'Deactivate':'Activate'}</button> <button class="s b2" onclick="prodForm('${p.id}')">Edit</button> <button class="s bd" onclick="prodDel('${p.id}')">Remove</button></td></tr>`).join('')}</table></div>`;
function prodToggle(id){const p=prod(id);p.on=p.on?0:1;persist();render()}
function prodDel(id){ask('Remove this product from the catalog? Existing quotations keep their saved snapshots.',()=>{S.products=S.products.filter(p=>p.id!==id);persist();render()},'Delete')}
function prodForm(id){const p=id?prod(id):{name:'',code:'',cat:S.cats[0].id,m:'unit',rate:0,tiers:[[1,0]],tax:S.set.tax,min:0};
 modal(`<h2>${id?'Edit':'Add'} product</h2><div class="grid">${fld('Name',`<input id="pn" value="${esc(p.name)}">`)}${fld('Code',`<input id="pc" value="${esc(p.code)}">`)}${fld('Category',`<select id="pk">${S.cats.map(c=>`<option value="${c.id}" ${c.id===p.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`)}${fld('Pricing method',`<select id="pm"><option value="unit" ${p.m=='unit'?'selected':''}>Per unit (quantity tiers)</option><option value="area" ${p.m=='area'?'selected':''}>Per area (sq ft)</option><option value="fixed" ${p.m=='fixed'?'selected':''}>Fixed package</option></select>`)}${fld('Area rate / fixed fee (₹)',`<input id="pr" type="number" value="${p.rate}">`)}${fld('Quantity tiers (qty:rate, comma separated)',`<input id="pt" value="${(p.tiers||[]).map(t=>t.join(':')).join(',')}">`)}${fld('Minimum order charge (₹)',`<input id="pmn" type="number" value="${p.min}">`)}${fld('GST % (0 = exempt/zero-rated)',`<input id="px" type="number" value="${p.tax}">`)}</div><div class="mu">New products get a quantity, delivery and notes configuration; specific options can be edited under Pricing Configuration.</div><br><button onclick="prodSave('${id||''}')">Save product</button>`)}
function prodSave(id){const n=$('#pn').value.trim(),m=$('#pm').value,tiers=$('#pt').value.split(',').map(x=>x.split(':').map(Number)).filter(t=>t.length==2&&t[0]>0&&t[1]>=0).sort((a,b)=>a[0]-b[0]);
 if(!n){toast('Enter a product name.','er');return}if(m==='unit'&&!tiers.length){toast('Add at least one quantity tier, e.g. 100:5','er');return}
 const v={name:n,code:$('#pc').value||'NEW',cat:$('#pk').value,m,rate:+$('#pr').value||0,tiers:m==='unit'?tiers:null,min:+$('#pmn').value||0,tax:+$('#px').value||0};
 if(id)Object.assign(prod(id),v);else S.products.push({id:'p'+uid(),on:1,f:[DEL,NOTE],...v});log('Saved product '+n);persist();closeM();render()}
V.cat=()=>`<h1>Product Categories</h1><div class="row"><input id="nc" style="max-width:260px" placeholder="New category name"><button class="bo" onclick="catAdd()">Add category</button></div><div class="card tw"><table><tr><th>Category</th><th class="n">Products</th><th>Status</th><th>Actions</th></tr>${S.cats.map(c=>`<tr><td><input value="${esc(c.name)}" onchange="S.cats.find(x=>x.id==='${c.id}').name=this.value;persist()"></td><td class="n">${S.products.filter(p=>p.cat===c.id).length}</td><td>${c.on?'Active':'Inactive'}</td><td><button class="s b2" onclick="const c=S.cats.find(x=>x.id==='${c.id}');c.on=c.on?0:1;persist();render()">${c.on?'Deactivate':'Activate'}</button> <button class="s bd" onclick="catDel('${c.id}')">Remove</button></td></tr>`).join('')}</table></div>`;
function catAdd(){const n=$('#nc').value.trim();if(!n){toast('Enter a category name.','er');return}S.cats.push({id:'c'+uid(),name:n,on:1});persist();render()}
function catDel(id){if(S.products.some(p=>p.cat===id)){toast('Move or remove this category’s products first.','er');return}S.cats=S.cats.filter(c=>c.id!==id);persist();render()}
V.price=()=>`<h1>Pricing Configuration</h1><div class="note">Demo prices. Changes apply to new quotation items only; saved quotations keep their original snapshot prices. Option charge types: f = fixed per item, u = per unit, p = % of base, a = per sq ft.</div>${S.products.map(p=>`<details class="card"><summary><b>${esc(p.name)}</b> <span class="mu">${mlab(p)} · GST ${p.tax}%</span></summary><div class="grid" style="margin-top:10px">${fld('Area rate / fixed fee (₹)',`<input type="number" value="${p.rate}" onchange="prod('${p.id}').rate=+this.value;persist()">`)}${fld('Min order charge (₹)',`<input type="number" value="${p.min}" onchange="prod('${p.id}').min=+this.value;persist()">`)}${fld('GST %',`<input type="number" value="${p.tax}" onchange="prod('${p.id}').tax=+this.value;persist()">`)}${p.tiers?fld('Tiers qty:rate',`<input value="${p.tiers.map(t=>t.join(':')).join(',')}" onchange="tiers_('${p.id}',this.value)">`):''}</div>${p.f.filter(f=>f.t==='sel').map(f=>`<div class="mu" style="margin-top:8px"><b>${f.l}</b></div><div class="row">${f.o.map((x,i)=>`<label class="mu">${esc(x[0])} <select style="width:auto" onchange="op_('${p.id}','${f.k}',${i},1,this.value)">${['f','u','p','a'].map(t=>`<option ${x[1]===t?'selected':''}>${t}</option>`).join('')}</select> <input type="number" step="any" style="width:80px" value="${x[2]}" onchange="op_('${p.id}','${f.k}',${i},2,this.value)"></label>`).join('')}</div>`).join('')}</details>`).join('')}`;
function tiers_(id,v){const t=v.split(',').map(x=>x.split(':').map(Number)).filter(t=>t.length==2&&t[0]>0).sort((a,b)=>a[0]-b[0]);if(!t.length){toast('Invalid tiers','er');return}prod(id).tiers=t;persist();toast('Tiers saved')}
function op_(id,k,i,j,v){prod(id).f.find(f=>f.k===k).o[i][j]=j==2?+v||0:v;persist()}
/* --- reports --- */
function repData(){return S.quotes.filter(q=>(!RF.a||q.date>=RF.a)&&(!RF.b||q.date<=RF.b))}
function grp(qs,fn){const m={};qs.forEach(q=>{const k=fn(q);(m[k]=m[k]||{n:0,v:0});m[k].n++;m[k].v+=tot(q).grand});return Object.entries(m)}
V.rep=()=>{const qs=repData(),tb=(h,rows)=>`<div class="card tw"><h2>${h[0]}</h2><table><tr>${h.slice(1).map((x,i)=>`<th class="${i?'n':''}">${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${i?'n':''}">${x}</td>`).join('')}</tr>`).join('')||'<tr><td>No data</td></tr>'}</table></div>`;
 const pm={};qs.forEach(q=>q.items.forEach(i=>{pm[i.name]=pm[i.name]||[0,0];pm[i.name][0]++;pm[i.name][1]+=i.qty}));
 return`<h1>Reports</h1><div class="note">Totals are quoted values, not revenue or payments received.</div><div class="row"><input type="date" style="width:auto" value="${RF.a}" onchange="RF.a=this.value;render()"><input type="date" style="width:auto" value="${RF.b}" onchange="RF.b=this.value;render()"><button class="b2" onclick="repCsv()">Export visible reports to CSV</button></div><div class="mu">${qs.length} quotations · quoted value ${inr(qs.reduce((a,q)=>a+tot(q).grand,0))}</div><br>
 ${tb(['Quotations by status','Status','Count','Quoted value'],grp(qs,q=>q.status).map(([k,v])=>[k,v.n,inr(v.v)]))}${tb(['Quotations created by date','Date','Count','Quoted value'],grp(qs,q=>fd(q.date)).map(([k,v])=>[k,v.n,inr(v.v)]))}${tb(['Quotations by salesperson','Salesperson','Count','Quoted value'],grp(qs,q=>q.sales).map(([k,v])=>[k,v.n,inr(v.v)]))}${tb(['Most frequently quoted products','Product','Times quoted','Total quantity'],Object.entries(pm).sort((a,b)=>b[1][0]-a[1][0]).map(([k,v])=>[k,v[0],v[1]]))}${tb(['Customer-wise history','Customer','Count','Quoted value'],grp(qs,q=>cust(q.cid).name).map(([k,v])=>[k,v.n,inr(v.v)]))}${tb(['Approved vs rejected','Outcome','Count','Quoted value'],grp(qs.filter(q=>/^Customer (Approved|Rejected)$/.test(q.status)),q=>q.status).map(([k,v])=>[k,v.n,inr(v.v)]))}${tb(['Expired quotations','Quotation','Customer','Quoted value'],qs.filter(q=>q.status==='Expired').map(q=>[q.no,esc(cust(q.cid).name),inr(tot(q).grand)]))}`};
function repCsv(){const qs=repData();csv([['Quotation','Date','Customer','Salesperson','Status','Items','Grand total (INR)']].concat(qs.map(q=>[q.no,q.date,cust(q.cid).name,q.sales,q.status,q.items.length,(tot(q).grand/100).toFixed(2)])),'quotation-report.csv')}
/* --- settings --- */
V.set=()=>{const s=S.set,i=(k,l,t)=>fld(l,`<input type="${t||'text'}" value="${esc(s[k])}" oninput="S.set.${k}=${t==='number'?'+':''}this.value">`);
 return`<h1>Settings</h1><div class="card"><h2>Company details (placeholders until approved by the client)</h2><div class="grid">${i('name','Company name')}${i('tag','Tagline')}${i('addr','Office address')}${i('phone','Phone')}${i('email','Email')}${i('web','Website')}${i('gstin','GSTIN')}${i('prefix','Quotation number prefix')}${i('tax','Default GST % for quotation-level charges','number')}${i('valid','Default validity (days)','number')}</div><label style="display:block;margin:10px 0"><input type="checkbox" style="width:auto" ${s.showNotes?'checked':''} onchange="S.set.showNotes=this.checked"> Show internal item notes on customer PDFs</label>${fld('Standard terms (one per line)',`<textarea rows="6" oninput="S.set.terms=this.value.split('\\n').filter(Boolean)">${esc(s.terms.join('\n'))}</textarea>`)}<br><button onclick="persist();render();toast('Settings saved')">Save settings</button></div>
 <div class="card"><h2>Demo data</h2><p class="mu">All customers, quotations and prices are demonstration data. Resetting restores the original sample data and removes your changes.</p><button class="bd" onclick="ask('Reset the POC to the original sample data? All saved quotations and customers will be replaced.',()=>{const u=S.user,r=S.role;S=seed();S.user=u;S.role=r;Q=null;persist();go('dash');toast('Demo data restored','wa')},'Reset')">Reset demo data</button></div>`};
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||!S.quotes)S=seed();
window.onhashchange=render;render();
</script></body></html>
